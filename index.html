<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f0f2f5; --text:#14171c; --muted:#5b6472;
  --line:#e2e5ea; --accent:#2563eb; --accent-soft:#e6eefc; --accent-text:#1d4ed8;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.06);
  --dot:100,116,139; --dot-a:.26;
  --radius:14px; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0f14; --surface:#141922; --surface-2:#1b212c; --text:#e7eaf0; --muted:#97a1b2;
    --line:#252c38; --accent:#60a5fa; --accent-soft:#16243b; --accent-text:#93c5fd;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --dot:215,220,228; --dot-a:.26;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0f14; --surface:#141922; --surface-2:#1b212c; --text:#e7eaf0; --muted:#97a1b2;
  --line:#252c38; --accent:#60a5fa; --accent-soft:#16243b; --accent-text:#93c5fd;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --dot:215,220,228; --dot-a:.26;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline}

/* Top bar */
.topbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1240px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px}
.brand{font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--accent)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav a{color:var(--muted);font-size:14px;padding:6px 10px;border-radius:8px;white-space:nowrap}
.nav a:hover,.nav a.active{color:var(--text);background:var(--surface-2);text-decoration:none}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;height:34px;min-width:34px;padding:0 10px;cursor:pointer;font:inherit;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.icon-btn:hover{border-color:var(--accent)}

/* Layout: hero on top, then main column + sidebar */
main{max-width:1240px;margin:0 auto;padding:32px 16px 64px;display:grid;gap:20px}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
.col-main,.col-side{display:grid;gap:20px;align-content:start;min-width:0}
@media (min-width:1180px){
  .cols{grid-template-columns:300px minmax(0,1fr)}
  .col-side{order:-1}
  .col-side .skill-groups{grid-template-columns:1fr}
  .col-side .module{padding:22px}
}
@media (min-width:1180px) and (min-height:1000px){
  .col-side{position:sticky;top:76px}
}
.module{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px}
.module h2{margin:0 0 18px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.module h2::after{content:"";flex:1;height:1px;background:var(--line)}

/* Hero */
.hero{padding:36px 28px;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.25fr);gap:32px;align-items:center}
@media (max-width:980px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 240px at 0% 0%,var(--accent-soft),transparent 70%);pointer-events:none}
.hero > *{position:relative}
.hero > div:first-child{display:flex;flex-direction:column;align-items:flex-start}
.hero > div:first-child .badge{order:-1}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--accent-text);background:var(--accent-soft);padding:5px 12px;border-radius:999px}
.badge .dot{width:7px;height:7px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 3px color-mix(in srgb,#16a34a 25%,transparent)}
.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.05;letter-spacing:-.03em;margin:18px 0 10px}
.hero .tagline{font-size:clamp(16px,2vw,19px);color:var(--muted);margin:0 0 22px;max-width:40ch}
.contact{display:flex;flex-wrap:wrap;gap:10px}
.contact a,.contact span{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--text);background:var(--surface-2);border:1px solid var(--line);padding:7px 12px;border-radius:9px}
.contact a:hover{border-color:var(--accent);text-decoration:none}
.contact svg{width:15px;height:15px;color:var(--muted)}

/* Terminal (always dark, in both themes) */
.term-wrap{min-width:0}
.term{background:#0b0e14;border:1px solid #232a36;border-radius:12px;box-shadow:0 14px 40px rgba(2,6,23,.32);overflow:hidden;font:12px/1.65 var(--mono);color:#c9d1d9}
.term-bar{display:flex;align-items:center;gap:12px;padding:9px 12px;background:#121722;border-bottom:1px solid #232a36}
.dots{display:flex;gap:6px;flex:none}
.dots i{width:10px;height:10px;border-radius:50%}
.dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.term-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.term-tabs::-webkit-scrollbar{display:none}
.term-tab,.term-ctl{font:inherit;font-size:12px;color:#8b949e;background:none;border:0;padding:3px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.term-tab:hover,.term-ctl:hover{color:#c9d1d9}
.term-tab.on{background:#1f2633;color:#e6edf3}
.term-ctl{flex:none;border:1px solid #2a3240}
.term-body{height:400px;overflow:hidden;padding:12px 14px;white-space:pre-wrap;word-break:break-word}
.tl{display:flex;min-height:1.65em}
.tl .g{flex:none;color:#4b5563;user-select:none}
.tl .g.ln{width:3.2ch;text-align:right;margin-right:1.4ch}
.tl .c{flex:1;min-width:0}
.t-prompt{color:#7ee787}.t-fn{color:#79c0ff}.t-var{color:#ffa657}.t-str{color:#a5d6ff}
.t-par{color:#d2a8ff}.t-kw{color:#ff7b72}.t-num{color:#f2cc60}
.t-com,.t-dim{color:#8b949e}.t-ok{color:#3fb950}.t-err{color:#f85149}.t-out{color:#c9d1d9}
.t-cur{display:inline-block;width:.55em;height:1.1em;background:#c9d1d9;vertical-align:-.2em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.term-note{font-size:12px;color:var(--muted);margin:8px 2px 0}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat b{display:block;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:13px;color:var(--muted)}

/* Summary */
.summary p{margin:0;font-size:17px;max-width:72ch}

/* Skills */
.skill-groups{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.skill-group h3{margin:0 0 10px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:3px 9px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);color:var(--text)}

/* Experience */
.timeline{display:grid;gap:8px}
.job{padding:22px 0;border-top:1px solid var(--line)}
.job:first-child{border-top:0;padding-top:0}
.job-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 16px;flex-wrap:wrap}
.job-head h3{margin:0;font-size:20px;letter-spacing:-.01em;color:var(--accent-text);display:flex;align-items:center;gap:10px}
.co-logo{width:34px;height:34px;flex:none;border-radius:9px;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.co-logo img{width:26px;height:26px;display:block}
.dates{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.roles{margin:14px 0 0 5px;padding-left:22px;border-left:2px solid var(--line);display:grid;gap:22px}
.role{position:relative}
.role::before{content:"";position:absolute;left:-30px;top:.35em;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.role.compact::before{border-color:var(--muted)}
.role-head b{font-size:16.5px;letter-spacing:-.01em}
.role-meta{font-size:13.5px;color:var(--muted);margin-top:1px}
.role.compact .role-head b{font-size:15px;font-weight:600}
.job ul{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.job li{position:relative;padding-left:18px}
.job li::before{content:"";position:absolute;left:0;top:.65em;width:6px;height:6px;border-radius:2px;background:var(--accent)}
.current{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#16a34a;margin-left:8px}

/* Architecture diagram */
.arch{margin:16px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:16px 18px}
.arch-title{font-size:13px;font-weight:600;margin:0 0 12px}
.lane{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:start;padding:8px 0}
.lane + .lane{border-top:1px dashed var(--line)}
.lane-label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:6px}
.flow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:20px;align-items:stretch}
.node{position:relative;font-size:12.5px;line-height:1.3;padding:6px 9px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.node:not(:last-child)::after{content:"→";position:absolute;right:-16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.node small{display:block;color:var(--muted);font-size:11px}
.node.key{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.arch-note{font-size:12px;color:var(--muted);margin:10px 0 0}

/* Credentials */
.cred{display:flex;align-items:center;gap:14px}
.cred + .cred{margin-top:16px}
.cred-icon{width:42px;height:42px;border-radius:11px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.cred-icon.brand{background:#fff;border:1px solid var(--line)}
.cred-icon.brand img{width:28px;height:28px;object-fit:contain;display:block}
.cred-icon.brand[style] img{width:34px}
.cred b{display:block;line-height:1.3}
.cred span{color:var(--muted);font-size:14px}

/* Accessibility */
.skip{position:absolute;left:12px;top:-60px;z-index:50;background:var(--accent);color:#fff;padding:8px 14px;border-radius:8px;font-weight:600}
.skip:focus{top:10px;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.term :focus-visible{outline-color:#79c0ff}
.t-in:focus-visible{outline:none}

/* Command palette */
.kbd{font:11px/1 var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:3px 5px}
@media (max-width:640px){.cmdk-btn .kbd{display:none}}
.cmdk{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgba(2,6,23,.55);backdrop-filter:blur(3px)}
.cmdk.open{display:flex}
.cmdk-box{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.4);overflow:hidden}
.cmdk-in{width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);font:inherit;font-size:16px;padding:15px 18px;outline:none}
.cmdk-in:focus-visible{outline:none}
.cmdk-list{max-height:min(380px,55vh);overflow-y:auto;padding:6px;margin:0;list-style:none}
.cmdk-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:15px}
.cmdk-item small{margin-left:auto;color:var(--muted);font-size:12px}
.cmdk-item.sel{background:var(--accent-soft);color:var(--accent-text)}
.cmdk-empty{padding:14px 12px;color:var(--muted);font-size:14px}
.cmdk-foot{display:flex;gap:14px;padding:9px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

/* Interactive shell */
.term-tab.shell-tab{color:#7ee787}
.term-body.live{overflow-y:auto;cursor:text}
.t-in{flex:1;min-width:0;background:none;border:0;outline:none;color:#e6edf3;font:inherit;padding:0;caret-color:#c9d1d9}
.t-h{color:#e6edf3;font-weight:500}
.term-body a{color:#79c0ff}
.term-note button{font:inherit;color:var(--accent-text);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* Fortune of the day */
.fortune{position:fixed;right:20px;bottom:20px;z-index:40;width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:14px 40px 14px 16px;opacity:0;transform:translateY(12px);transition:opacity .35s ease,transform .35s ease;pointer-events:none}
.fortune.show{opacity:1;transform:none;pointer-events:auto}
.fortune p{margin:0}
.fortune .f-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text);margin-bottom:4px}
.fortune .f-text{font-size:14px;line-height:1.5}
.fortune .f-sub{font-size:12px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.fortune .f-sub button{position:static;width:auto;height:auto;padding:1px 6px;font:12px var(--mono);color:var(--accent-text);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;vertical-align:1px}
.fortune .f-sub button:hover{border-color:var(--accent)}
.fortune button{position:absolute;top:8px;right:8px;width:26px;height:26px;border:0;border-radius:7px;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer}
.fortune button:hover{background:var(--surface-2);color:var(--text)}
@media (max-width:640px){.fortune{right:16px;bottom:16px}}
@media (prefers-reduced-motion:reduce){.fortune{transition:none}}

/* Case-study links */
.case-link{display:inline-flex;align-items:center;gap:6px;margin:12px 0 2px;font-size:14px;font-weight:600;padding:6px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.case-link:hover{border-color:var(--accent);text-decoration:none}

/* decrypt game tiles */
.w-t{display:inline-block;width:1.7em;text-align:center;border-radius:4px;margin-right:3px;font-weight:600;color:#fff}
.w-hit{background:#238636}.w-near{background:#9e6a03}.w-miss{background:#30363d;color:#8b949e}

/* Certifications */
.cred .pill{display:block;width:fit-content;font-size:11px;font-weight:600;letter-spacing:.02em;padding:1px 7px;border-radius:999px;margin:3px 0 2px;line-height:1.5;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.cred a.verify{font-size:13px;margin-left:6px}

/* Print QR */
.qr{width:.78in;height:.78in}

/* Dot-matrix background */
#dots{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
main,footer{position:relative;z-index:1}

footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 40px}
footer a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}

/* Reveal */
.module{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
.module.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.module{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}

/* Responsive */
@media (max-width:860px){
  .skill-groups{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .roles{padding-left:16px}
  .role::before{left:-24px}
  .lane{grid-template-columns:1fr;gap:6px}
  .lane-label{padding-top:0}
  .flow{grid-auto-flow:row;gap:18px}
  .node:not(:last-child)::after{content:"↓";right:auto;top:auto;left:50%;bottom:-18px;transform:translateX(-50%)}
}
@media (max-width:520px){
  .module{padding:20px}
  .hero{padding:26px 18px}
  .brand{display:none}
  .icon-btn .lbl{display:none}
  .term{font-size:11px}
  .term-body{height:340px;padding:10px}
  .stat b{font-size:22px}
}

/* Print / Save as PDF: a conventional one-column resume */
.print-only{display:none!important}
@media print{
  @page{size:letter;margin:.42in .5in}
  :root,:root[data-theme],:root:not([data-theme="light"]){
    --bg:#fff;--surface:#fff;--surface-2:#fff;--text:#111;--muted:#4b5563;--line:#d1d5db;
    --accent:#1d4ed8;--accent-soft:#fff;--accent-text:#1d4ed8;--shadow:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html{scroll-padding:0}
  *,*::before,*::after{transition:none!important;animation:none!important}
  body{font-size:9.6pt;line-height:1.33;background:#fff;color:var(--text)}
  .topbar,footer,#dots,.cmdk,.skip,.fortune,.co-logo,.case-link,.term-wrap,.hero::before,.arch,.badge .dot,#credentials{display:none!important}
  main{display:block;max-width:none;padding:0}
  .cols,.col-main,.col-side{display:block;position:static}
  .module{opacity:1!important;transform:none!important;box-shadow:none;border:0;border-radius:0;padding:0;margin:0 0 9pt;background:none}
  .module h2{font-size:8.5pt;letter-spacing:.12em;color:var(--accent-text);margin:0 0 5pt;padding-bottom:2pt;border-bottom:1px solid var(--line);break-after:avoid}
  .module h2::after{display:none}

  /* Header */
  .hero{display:block;position:static;padding:0;margin-bottom:9pt;overflow:visible}
  .hero > *{position:static}
  .hero > div:first-child{display:block}
  .hero .qr{display:block!important;position:absolute;top:0;right:0}
  .hero h1{font-size:22pt;margin:0}
  .hero .tagline{font-size:10.5pt;margin:1pt 0 3pt;max-width:none;color:var(--muted)}
  .badge{display:block;background:none;padding:0;border-radius:0;font-size:9.5pt;font-weight:600;color:var(--text);margin:0 0 1pt}
  .contact{gap:0}
  .contact a,.contact span{display:inline!important;background:none;border:0;padding:0;border-radius:0;font-size:9.5pt;color:var(--text)}
  .contact > * + *::before{content:"·";margin:0 6pt;color:var(--muted)}
  .contact svg{display:none}
  .contact a[data-print]::after{content:": " attr(data-print)}

  /* Impact numbers: one quiet row */
  .stats{grid-template-columns:repeat(4,1fr);gap:10pt}
  .stat{border:0;border-radius:0;padding:0 0 0 7pt;background:none;border-left:2px solid var(--accent)}
  .stat b{font-size:12.5pt}
  .stat span{font-size:8.5pt;line-height:1.25;display:block}
  .summary p{font-size:9.6pt;max-width:none}
  .job.single .job-head .dates{display:none}

  /* Experience */
  .job{padding:0 0 7pt;border:0}
  .job + .job{padding-top:2pt}
  .job-head{break-after:avoid}

  { tab: "erp-relay/run.ps1", lang: "ps", code: String.raw`# Okta Workflows ⇄ legacy IFS ERP relay · PowerShell Azure Function (GCC High)
# VNet integration routes ERP calls into the internal VLAN; Okta only ever sees this endpoint.
using namespace System.Net
param($Request)

$Ops      = @{ 'employee.get' = 'GET'; 'employee.create' = 'POST'; 'employee.update' = 'PATCH' }
$Editable = 'Email', 'Status', 'SupervisorId'
$Entity   = "$env:ERP_BASE_URL/EmployeeHandling.svc/Employees"

function Reply([int]$Code, $Body) {
    Push-OutputBinding -Name Response -Value ([HttpResponseContext]@{
        StatusCode = $Code; ContentType = 'application/json'; Body = ($Body | ConvertTo-Json -Compress) })
}

if (-not (Test-RelaySignature $Request)) {    # HMAC-SHA256 over RawBody · 5-min window · nonce cache
    return Reply 401 ([ordered]@{ error = 'unauthorized'; detail = 'signature mismatch' })
}
$op = $Request.Params.op
if (-not $Ops.ContainsKey($op)) {
    return Reply 403 ([ordered]@{ error = 'forbidden'; detail = "'$op' is not allowlisted" })
}
$id = "$($Request.Body.id)".Trim().ToUpper()
if (-not $id) { return Reply 400 ([ordered]@{ error = 'bad_request'; detail = "'id' is required" }) }

$fields = [ordered]@{}                          # allowlisted, trimmed fields only
foreach ($f in $Editable) {
    if ($Request.Body.fields.$f) { $fields[$f] = "$($Request.Body.fields.$f)".Trim() }
}
if ($op -eq 'employee.create') { $fields.Insert(0, 'EmpNo', $id) }

$erp = @{
    Uri                = if ($op -eq 'employee.create') { $Entity } else { "$Entity(EmpNo='$id')" }
    Method             = $Ops[$op]
    Headers            = Get-ErpHeaders $op $id  # OAuth client-credentials token + If-Match ETag
    Body               = if ($fields.Count) { $fields | ConvertTo-Json } else { $null }
    ContentType        = 'application/json'
    SkipHttpErrorCheck = $true
    TimeoutSec         = 20
}
try { $r = Invoke-WebRequest @erp }
catch {
    Write-Error "ERP unreachable ($op): $($_.Exception.Message)"
    return Reply 502 @{ error = 'upstream_unavailable' }
}
if ($r.StatusCode -ge 500) { return Reply 502 @{ error = 'upstream_unavailable' } }
if ($r.StatusCode -ge 400) { return Reply $r.StatusCode @{ error = 'upstream_rejected' } }

# Relay the ERP's answer back to Okta
$out = [ordered]@{ status = 'ok'; upstream = [int]$r.StatusCode }
if ($fields.Count) { $out.applied = @($fields.Keys) }
if ($r.Content)    { $out.data = $r.Content | ConvertFrom-Json | Select-Object EmpNo, Email, Status }
Reply 200 $out`,

param($Request)

Connect-MgGraph -Identity -Environment USGov -NoWelcome

    $tok = (Invoke-RestMethod $mi -Headers @{ 'X-IDENTITY-HEADER' = $env:IDENTITY_HEADER }).access_token
    $job = @{ properties = @{

        parameters = @{ Upn = $upn } } } | ConvertTo-Json -Depth 4
    $req = @{ Method = 'Put'; Body = $job; ContentType = 'application/json'

}

  `<div class="cols"><div class="col-main">${L.main.map(R).join("")}</div><aside class="col-side">${L.side.map(R).join("")}</aside></div>`;

const navOrder = [...L.top, ...L.main, ...L.side].filter(k => MODULES[k].title);
document.getElementById("nav").innerHTML = navOrder.map(k => `<a href="#${k}">${MODULES[k].title}</a>`).join("");

/* Theme toggle (remembered per browser) */
const root = document.documentElement;
try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch(e){}
document.getElementById("themeBtn").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch(e){}
};
document.getElementById("printBtn").onclick = () => window.print();

/* Reveal on scroll + count-up stats */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const countUp = el => {
  const end = +el.dataset.count, pre = el.dataset.prefix, suf = el.dataset.suffix, t0 = performance.now();
  const step = t => { const p = Math.min((t - t0) / 1100, 1), v = Math.round(end * (1 - Math.pow(1 - p, 3)));
    el.textContent = pre + v.toLocaleString() + suf; if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
};
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add("in");
  if (!reduce) e.target.querySelectorAll("[data-count]").forEach(countUp);
  io.unobserve(e.target);
}), { threshold: .08 });
document.querySelectorAll(".module").forEach(m => io.observe(m));

/* Active nav link */
// Active = the last main-column section whose top has passed a reading line just under the top bar.
// Sidebar cards (Clearance, Skills) sit beside the main column on wide screens, so they're only
// scroll-tracked when the layout is stacked; clicking one still highlights it while it's on screen.
const links = [...document.querySelectorAll(".nav a")];
const navEls = navOrder.map(k => document.getElementById(k)).filter(Boolean);
const sideCol = document.querySelector(".col-side"), mainCol = document.querySelector(".col-main");
let clicked = null;
const setActive = id => links.forEach(a => { const on = a.hash === "#" + id; a.classList.toggle("active", on); if (on) a.setAttribute("aria-current", "location"); else a.removeAttribute("aria-current"); });
const updateNav = () => {
  if (clicked) {
    const r = clicked.getBoundingClientRect();
    if (r.bottom > 60 && r.top < innerHeight) return setActive(clicked.id);
    clicked = null;
  }
  const twoCol = sideCol && mainCol && sideCol.getBoundingClientRect().right <= mainCol.getBoundingClientRect().left + 1;
  const pool = navEls.filter(el => !(twoCol && sideCol.contains(el)))
    .sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);
  const line = document.querySelector(".topbar").offsetHeight + innerHeight * 0.25;
  let cur = null;
  for (const el of pool) if (el.getBoundingClientRect().top <= line) cur = el;
  if (innerHeight + scrollY >= document.documentElement.scrollHeight - 2 && pool.length) cur = pool[pool.length - 1];
  setActive(cur ? cur.id : "");
};
links.forEach(a => a.addEventListener("click", () => { clicked = document.getElementById(a.hash.slice(1)); setActive(clicked.id); }));
let navTick = 0;
addEventListener("scroll", () => { if (!navTick) navTick = requestAnimationFrame(() => { navTick = 0; updateNav(); }); }, { passive: true });
addEventListener("resize", updateNav);
updateNav();

    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); box.classList.contains("open") ? close() : open(); }
  });
  inp.addEventListener("input", () => { sel = 0; render(); });
  inp.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (shown.length) { sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + shown.length) % shown.length; render(); } }
    else if (e.key === "Enter") { e.preventDefault(); exec(sel); }
    else if (e.key === "Escape") { e.preventDefault(); close(); }
    else if (e.key === "Tab") e.preventDefault();      // keep focus inside the dialog
  });
  list.addEventListener("mousemove", e => { const it = e.target.closest(".cmdk-item"); if (it && +it.dataset.i !== sel) { sel = +it.dataset.i; render(); } });
  list.addEventListener("click", e => { const it = e.target.closest(".cmdk-item"); if (it) exec(+it.dataset.i); });
  box.addEventListener("mousedown", e => { if (e.target === box) close(); });
})();
/* Dot-matrix background: 14px grid, sine shimmer, pointer push + damped spring return */
(() => {
  const cv = document.getElementById("dots"), ctx = cv.getContext("2d");
  const GAP = 14, R = 155, PUSH = 20, EASE = 0.10, DRAG = 0.45, still = reduce;
  let W = 0, H = 0, dpr = 1, dots = [], bg = "#0c0f14", rgb = "215,220,228", base = .26, raf = 0;
  const ptr = { x: -1e4, y: -1e4, energy: 0 };
  const readTheme = () => {
    const cs = getComputedStyle(root);
    bg = cs.getPropertyValue("--bg").trim() || bg;
    rgb = cs.getPropertyValue("--dot").trim() || rgb;
    base = parseFloat(cs.getPropertyValue("--dot-a")) || base;
  };
  const build = () => {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dots = [];
    const ox = (W % GAP) / 2 + GAP / 2, oy = (H % GAP) / 2 + GAP / 2;
    for (let y = oy; y < H; y += GAP) for (let x = ox; x < W; x += GAP)
      dots.push({ hx: x, hy: y, x, y, vx: 0, vy: 0, ph: (x + y) * 0.018 + Math.random() * 1.2 });
  };
  // Physics runs in fixed 1/120 s steps so motion is identical at 60, 144 or 300 Hz
  const STEP = 1000 / 120, LEVELS = 8, buckets = Array.from({ length: LEVELS }, () => []);
  const physics = () => {
    const active = ptr.energy > 0.01;
    for (const d of dots) {
      if (active) {
        const dx = d.x - ptr.x, dy = d.y - ptr.y, dist = Math.hypot(dx, dy);
        if (dist < R && dist > 0.01) {
          const f = (1 - dist / R) * PUSH * 0.05 * ptr.energy;
          d.vx += dx / dist * f; d.vy += dy / dist * f;
        }
      }
      d.vx = (d.vx + (d.hx - d.x) * EASE) * (1 - DRAG);
      d.vy = (d.vy + (d.hy - d.y) * EASE) * (1 - DRAG);
      d.x += d.vx; d.y += d.vy;
    }
    ptr.energy *= 0.92;
  };
  // Batched draw: dots grouped into 8 brightness levels, one fill per level (8 draw calls, not ~19k)
  const draw = t => {
    ctx.globalAlpha = 1; ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = `rgb(${rgb})`;
    const time = t * 0.0011;
    for (const b of buckets) b.length = 0;
    for (const d of dots) {
      const s = still ? 1 : 0.5 + 0.5 * Math.sin(time + d.ph);   // 0..1
      buckets[Math.min(LEVELS - 1, (s * LEVELS) | 0)].push(d);
    }
    for (let i = 0; i < LEVELS; i++) {
      const b = buckets[i]; if (!b.length) continue;
      ctx.globalAlpha = still ? base : base * (0.44 + 0.56 * (i + 0.5) / LEVELS);
      ctx.beginPath();
      for (const d of b) ctx.rect(d.x - 0.8, d.y - 0.8, 1.6, 1.6);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  };
  let last = 0, acc = 0, next = 0;
  const loop = t => {
    raf = document.hidden ? 0 : requestAnimationFrame(loop);
    if (!last) last = next = t;
    if (t < next - 0.5) return;                      // cap rendering at 120 fps (deadline-based, so 144 Hz still gets 120)
    next = t - next > STEP ? t + STEP : next + STEP;
    acc = Math.min(acc + (t - last), STEP * 6); last = t;
    while (acc >= STEP) { physics(); acc -= STEP; }
    draw(t);
  };
  const frame = () => still ? draw(0) : (raf || (raf = requestAnimationFrame(loop)));
  addEventListener("pointermove", e => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.energy = 1; }, { passive: true });
  addEventListener("pointerleave", () => { ptr.energy = 0; });
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { build(); if (still) draw(0); }, 120); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { last = 0; frame(); } });
  const retheme = () => { readTheme(); if (still) draw(0); };
  new MutationObserver(retheme).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", retheme);
  readTheme(); build(); frame();
})();
</script>
