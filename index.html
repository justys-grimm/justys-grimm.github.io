<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Justys Grimm — Resume</title>
<meta name="description" content="Identity and cloud automation engineer — Azure Government, GCC High, Okta, Entra ID.">
<meta property="og:title" content="Justys Grimm — Identity & Cloud Automation Engineer">
<meta property="og:description" content="Okta, Microsoft Entra ID, Azure Government / GCC High automation. Active TS/SCI eligibility.">
<meta property="og:type" content="profile">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='30' font-weight='700' fill='white' text-anchor='middle'%3EJG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f0f2f5; --text:#14171c; --muted:#5b6472;
  --line:#e2e5ea; --accent:#2563eb; --accent-soft:#e6eefc; --accent-text:#1d4ed8;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.06);
  --radius:14px; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0f14; --surface:#141922; --surface-2:#1b212c; --text:#e7eaf0; --muted:#97a1b2;
    --line:#252c38; --accent:#60a5fa; --accent-soft:#16243b; --accent-text:#93c5fd;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0c0f14; --surface:#141922; --surface-2:#1b212c; --text:#e7eaf0; --muted:#97a1b2;
  --line:#252c38; --accent:#60a5fa; --accent-soft:#16243b; --accent-text:#93c5fd;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline}

/* Top bar */
.topbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px}
.brand{font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--accent)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav a{color:var(--muted);font-size:14px;padding:6px 10px;border-radius:8px;white-space:nowrap}
.nav a:hover,.nav a.active{color:var(--text);background:var(--surface-2);text-decoration:none}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;height:34px;min-width:34px;padding:0 10px;cursor:pointer;font:inherit;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.icon-btn:hover{border-color:var(--accent)}

/* Layout */
main{max-width:1080px;margin:0 auto;padding:32px 16px 64px;display:grid;gap:20px}
.module{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px}
.module h2{margin:0 0 18px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.module h2::after{content:"";flex:1;height:1px;background:var(--line)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* Hero */
.hero{padding:40px 28px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 240px at 100% 0%,var(--accent-soft),transparent 70%);pointer-events:none}
.hero > *{position:relative}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--accent-text);background:var(--accent-soft);padding:5px 12px;border-radius:999px}
.badge .dot{width:7px;height:7px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 3px color-mix(in srgb,#16a34a 25%,transparent)}
.hero h1{font-size:clamp(34px,6vw,56px);line-height:1.05;letter-spacing:-.03em;margin:18px 0 10px}
.hero .tagline{font-size:clamp(16px,2.2vw,20px);color:var(--muted);margin:0 0 22px;max-width:46ch}
.contact{display:flex;flex-wrap:wrap;gap:10px}
.contact a,.contact span{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--text);background:var(--surface-2);border:1px solid var(--line);padding:7px 12px;border-radius:9px}
.contact a:hover{border-color:var(--accent);text-decoration:none}
.contact svg{width:15px;height:15px;color:var(--muted)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat b{display:block;font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}

/* Summary */
.summary p{margin:0;font-size:17px;max-width:72ch}

/* Skills */
.skill-groups{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.skill-group h3{margin:0 0 10px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 10px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.filter-note{font-size:13px;color:var(--muted);margin:14px 0 0;min-height:1.4em}
.filter-note button{background:none;border:0;color:var(--accent-text);cursor:pointer;font:inherit;padding:0}

/* Experience */
.timeline{position:relative;display:grid;gap:8px}
.job{display:grid;grid-template-columns:180px 1fr;gap:24px;padding:20px 0;border-top:1px solid var(--line)}
.job:first-child{border-top:0;padding-top:0}
.job-meta{font-size:14px;color:var(--muted)}
.job-meta .dates{font-family:var(--mono);font-size:12.5px;color:var(--text);display:block;margin-bottom:4px}
.job h3{margin:0;font-size:19px;letter-spacing:-.01em}
.job .org{color:var(--accent-text);font-weight:500;margin:2px 0 12px}
.job ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.job li{position:relative;padding-left:18px;color:var(--text)}
.job li::before{content:"";position:absolute;left:0;top:.65em;width:6px;height:6px;border-radius:2px;background:var(--accent)}
.job li.dim{opacity:.32}
.job li mark{background:var(--accent-soft);color:var(--accent-text);border-radius:4px;padding:0 3px}
.current{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#16a34a;margin-left:8px}

/* Education */
.cert{display:flex;align-items:center;gap:14px}
.cert-icon{width:44px;height:44px;border-radius:11px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.cert b{display:block}
.cert span{color:var(--muted);font-size:14px}
.clearance{display:flex;align-items:center;gap:14px}

footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 40px}

/* Reveal */
.module{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
.module.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.module{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}

/* Responsive */
@media (max-width:860px){
  .skill-groups{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid-2{grid-template-columns:1fr}
  .job{grid-template-columns:1fr;gap:6px}
}
@media (max-width:520px){
  .module{padding:20px}
  .hero{padding:28px 20px}
  .brand{display:none}
  .icon-btn .lbl{display:none}
}

/* Print */
@media print{
  :root{--bg:#fff;--surface:#fff;--surface-2:#fff;--text:#000;--muted:#444;--line:#ddd;--accent:#1d4ed8;--accent-soft:#fff;--accent-text:#1d4ed8;--shadow:none}
  .topbar,footer,.filter-note,.hero::before{display:none!important}
  main{padding:0;gap:10px}
  .module{opacity:1;transform:none;box-shadow:none;border:0;padding:8px 0;break-inside:avoid}
  .chip{cursor:default}
  body{font-size:12px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">J<span>.</span>Grimm</div>
    <nav class="nav" id="nav"></nav>
    <button class="icon-btn" id="printBtn" title="Print or save as PDF">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg><span class="lbl">PDF</span>
    </button>
    <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main id="app"></main>
<footer id="footer"></footer>

<script>
/* ============================================================
   CONTENT — edit everything here. Each module reads from this.
   ============================================================ */
const RESUME = {
  name: "Justys Grimm",
  tagline: "Identity & cloud automation engineer for regulated DoD and Azure Government environments.",
  badge: "Active TS/SCI Eligibility",
  contact: [
    { type: "location", label: "Wichita, KS" }
    /* Add more, e.g. { type: "email", label: "you@example.com", href: "mailto:you@example.com" } */
  ],
  focus: ["Identity & Cloud Automation", "Azure Government / GCC High"],

  stats: [
    { value: 20000, suffix: "",  label: "Users onboarded to Okta" },
    { value: 100,   prefix: "~", label: "Enterprise apps consolidated" },
    { value: 4000,  prefix: "~", label: "Devices migrated to Entra ID" },
    { value: 4,     suffix: "+ yrs", label: "IAM & automation at V2X" }
  ],

  summary: "Identity and integration engineer supporting regulated DoD and Azure Government environments. Builds secure custom APIs and serverless automation connecting Okta, legacy ERP platforms, Azure Automation, Active Directory, and Microsoft Entra ID. Delivers scalable identity rollouts, lifecycle controls, and ITGC-ready operational systems.",

  skills: [
    { group: "Identity & Cloud", items: ["Active Directory","Microsoft Entra ID","Microsoft Graph","Azure Government","Azure RBAC","Azure Functions","Azure Automation","Azure Blob Storage","Azure SQL","Okta"] },
    { group: "Automation & Integration", items: ["PowerShell","Python","REST and OData APIs","OAuth 2.0","HMAC request signing","Managed identities","Okta Workflows","IFS ERP integration"] },
    { group: "Endpoint & Compliance", items: ["Intune","Autopilot","SCCM","Exchange Online","Microsoft 365","GCC High","ITGC evidence & audit","Power BI"] }
  ],

  experience: [
    {
      company: "V2X (Vectrus)", location: "Reston, VA",
      title: "Automation Engineer (IAM)", start: "March 2022", end: "Present",
      bullets: [
        "Led the initial Okta configuration and enterprise rollout for a 20,000-user organization, consolidating authentication for approximately 100 enterprise applications into Okta and establishing SSO, lifecycle management, and automated provisioning patterns across SaaS applications.",
        "Engineered a custom Azure Function API connecting Okta Workflows to legacy IFS ERP services; implemented allowlisted create, retrieve, and update operations, HMAC request validation, anti-replay timestamps, input normalization, and upstream error handling.",
        "Developed PowerShell Azure Function Apps that securely orchestrate Okta-triggered privileged-account termination requests into Azure Automation Hybrid Worker runbooks using OAuth 2.0 bearer tokens, managed identity, and Azure Resource Manager job APIs.",
        "Architected a GCC High termination-evidence platform using Azure Functions, Blob Storage, Event Grid, Storage Queues, Azure SQL, managed identities, and Power BI, with immutable evidence handling and controlled reporting access.",
        "Led endpoint migration work for approximately 4,000 devices from hybrid Active Directory domain join to cloud-native Microsoft Entra ID domain join."
      ]
    },
    {
      company: "Tech Experts", location: "Colorado Springs, CO",
      title: "Technical Support Engineer", start: "April 2021", end: "March 2022",
      bullets: ["Supported GCC High and DoD Exchange environments and managed critical customer escalations through ticket-based support workflows."]
    },
    {
      company: "ADT Security", location: "Colorado Springs, CO",
      title: "Radio Technician", start: "April 2021", end: "October 2021",
      bullets: ["Installed, configured, and troubleshot low-voltage security and communications equipment in field environments."]
    }
  ],

  education: [
    { name: "CompTIA A+ Certification", detail: "CompTIA", year: "2020" }
  ],
  clearance: { name: "TS/SCI Eligibility", detail: "Active" },

  /* Order and visibility of modules. Remove or reorder to customize. */
  layout: ["hero", "stats", "summary", "skills", "experience", ["education", "clearance"]]
};

/* Keyword aliases so skill chips match bullet wording. */
const SKILL_ALIASES = {
  "Azure Blob Storage": ["Blob Storage"],
  "Managed identities": ["managed identity","managed identities"],
  "REST and OData APIs": ["API"],
  "IFS ERP integration": ["IFS ERP"],
  "Microsoft Entra ID": ["Entra ID"],
  "ITGC evidence & audit": ["ITGC","evidence"],
  "HMAC request signing": ["HMAC"],
  "Azure Automation": ["Azure Automation"],
  "GCC High": ["GCC High"]
};

/* ============================================================
   MODULES — each returns an HTML string for one section.
   ============================================================ */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ICONS = {
  location:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-7.5 7-13a7 7 0 0 0-14 0c0 5.5 7 13 7 13z"/><circle cx="12" cy="9" r="2.5"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
  email:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>',
  cert:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M15.5 13 17 22l-5-3-5 3 1.5-9"/></svg>',
  shield:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>'
};

const MODULES = {
  hero: { title: null, render: r => `
    <section class="module hero" id="top">
      <span class="badge"><span class="dot"></span>${esc(r.badge)}</span>
      <h1>${esc(r.name)}</h1>
      <p class="tagline">${esc(r.tagline)}</p>
      <div class="contact">
        ${r.contact.map(c => c.href
          ? `<a href="${esc(c.href)}">${ICONS[c.type]||""}${esc(c.label)}</a>`
          : `<span>${ICONS[c.type]||""}${esc(c.label)}</span>`).join("")}
      </div>
    </section>`},

  stats: { title: null, render: r => `
    <section class="module" id="impact" aria-label="Impact">
      <div class="stats">
        ${r.stats.map(s => `<div class="stat"><b data-count="${s.value}" data-prefix="${esc(s.prefix||"")}" data-suffix="${esc(s.suffix||"")}">${esc(s.prefix||"")}${s.value.toLocaleString()}${esc(s.suffix||"")}</b><span>${esc(s.label)}</span></div>`).join("")}
      </div>
    </section>`},

  summary: { title: "Summary", render: r => `
    <section class="module summary" id="summary">
      <h2>Professional Summary</h2>
      <p>${esc(r.summary)}</p>
    </section>`},

  skills: { title: "Skills", render: r => `
    <section class="module" id="skills">
      <h2>Technical Skills</h2>
      <div class="skill-groups">
        ${r.skills.map(g => `<div class="skill-group"><h3>${esc(g.group)}</h3><div class="chips">
          ${g.items.map(i => `<button class="chip" data-skill="${esc(i)}">${esc(i)}</button>`).join("")}
        </div></div>`).join("")}
      </div>
      <p class="filter-note" id="filterNote">Tip: click a skill to highlight where it was used.</p>
    </section>`},

  experience: { title: "Experience", render: r => `
    <section class="module" id="experience">
      <h2>Professional Experience</h2>
      <div class="timeline">
        ${r.experience.map(j => `<article class="job">
          <div class="job-meta"><span class="dates">${esc(j.start)} — ${esc(j.end)}</span>${esc(j.location)}</div>
          <div>
            <h3>${esc(j.title)}${j.end==="Present"?'<span class="current">Current</span>':""}</h3>
            <div class="org">${esc(j.company)}</div>
            <ul>${j.bullets.map(b => `<li data-text="${esc(b)}">${esc(b)}</li>`).join("")}</ul>
          </div>
        </article>`).join("")}
      </div>
    </section>`},

  education: { title: "Education", render: r => `
    <section class="module" id="education">
      <h2>Education &amp; Certification</h2>
      ${r.education.map(e => `<div class="cert"><div class="cert-icon">${ICONS.cert}</div><div><b>${esc(e.name)}</b><span>${esc(e.detail)} · ${esc(e.year)}</span></div></div>`).join("")}
    </section>`},

  clearance: { title: "Clearance", render: r => `
    <section class="module" id="clearance">
      <h2>Clearance</h2>
      <div class="clearance"><div class="cert-icon">${ICONS.shield}</div><div><b>${esc(r.clearance.name)}</b><span>${esc(r.clearance.detail)}</span></div></div>
    </section>`}
};

/* ============================================================
   RENDER
   ============================================================ */
const app = document.getElementById("app");
app.innerHTML = RESUME.layout.map(entry => Array.isArray(entry)
  ? `<div class="grid-2">${entry.map(k => MODULES[k].render(RESUME)).join("")}</div>`
  : MODULES[entry].render(RESUME)).join("");

const flat = RESUME.layout.flat();
document.getElementById("nav").innerHTML = flat
  .filter(k => MODULES[k].title)
  .map(k => `<a href="#${k}">${MODULES[k].title}</a>`).join("");
document.getElementById("footer").textContent = `© ${new Date().getFullYear()} ${RESUME.name}`;

/* Theme toggle (remembered per browser) */
const root = document.documentElement;
try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch(e){}
document.getElementById("themeBtn").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch(e){}
};
document.getElementById("printBtn").onclick = () => window.print();

/* Reveal on scroll + count-up stats */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const countUp = el => {
  const end = +el.dataset.count, pre = el.dataset.prefix, suf = el.dataset.suffix, t0 = performance.now();
  const step = t => { const p = Math.min((t - t0) / 1100, 1), v = Math.round(end * (1 - Math.pow(1 - p, 3)));
    el.textContent = pre + v.toLocaleString() + suf; if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
};
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add("in");
  if (!reduce) e.target.querySelectorAll("[data-count]").forEach(countUp);
  io.unobserve(e.target);
}), { threshold: .12 });
document.querySelectorAll(".module").forEach(m => io.observe(m));

/* Active nav link */
const links = [...document.querySelectorAll(".nav a")];
const navIO = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) links.forEach(a => a.classList.toggle("active", a.hash === "#" + e.target.id));
}), { rootMargin: "-40% 0px -55% 0px" });
flat.forEach(k => { const el = document.getElementById(k); if (el) navIO.observe(el); });

/* Skill filter: highlight matching experience bullets */
const bullets = [...document.querySelectorAll(".job li")];
const note = document.getElementById("filterNote");
const defaultNote = note.innerHTML;
const termsFor = s => [s, ...(SKILL_ALIASES[s] || [])].map(t => t.toLowerCase());
let active = null;
document.querySelectorAll(".chip").forEach(chip => chip.onclick = () => {
  const skill = chip.dataset.skill;
  active = active === skill ? null : skill;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.skill === active));
  let hits = 0;
  bullets.forEach(li => {
    const text = li.dataset.text;
    if (!active) { li.classList.remove("dim"); li.textContent = text; return; }
    const terms = termsFor(active).sort((a,b) => b.length - a.length);
    const re = new RegExp("(" + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
    const match = re.test(text);
    li.classList.toggle("dim", !match);
    li.innerHTML = match ? esc(text).replace(re, "<mark>$1</mark>") : esc(text);
    if (match) hits++;
  });
  note.innerHTML = active
    ? `${hits ? `<b>${esc(active)}</b> appears in ${hits} highlight${hits>1?"s":""}.` : `<b>${esc(active)}</b> is a core skill — not called out in a specific bullet.`} <button id="clearF">Clear</button>`
    : defaultNote;
  const c = document.getElementById("clearF"); if (c) c.onclick = () => document.querySelector(".chip.on").click();
});
</script>
</body>
</html>
